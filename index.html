class Ghost{constructor(w,r,h=1,o=0,am=1){this.t=ENEMY[w%3];this.h=h;this.max=this.hp=Math.round(500*1.25**w*h);this.atk0=15*1.15**w*h**.8*am;this.lv=1;this.exp=0;this.x=240;this.y=-20-Math.abs(o)*2;this.cd=1;this.room=r;this.tx=r.L?222:258;this.ty=r.dy+o;this.state='walk';this.bob=0}get atk(){return this.atk0*1.15**(this.lv-1)}update(dt,e){this.bob+=dt;const s=this.t.s*(this.h>1?1.3:1)*dt,d=e.door,r=this.room;if(this.state==='walk'){if(Math.abs(this.y-this.ty)>2)this.y+=Math.sign(this.ty-this.y)*s;else if(Math.abs(this.x-this.tx)>2)this.x+=Math.sign(this.tx-this.x)*s;else this.state='attack'}else if(this.state==='attack'){if(d.broken){this.state='enter';return}this.cd-=dt;if(this.cd<=0){this.cd=1;d.hp-=this.atk;d.shake=.3;e.float(this.tx,this.ty-34,'-'+Math.round(this.atk),'#ff5d73');if(++this.exp>=3){this.exp=0;this.lv++;e.float(this.x,this.y-52,'เลเวลอัป!','#ff80ab')}if(d.hp<=0){if(d.rv<({c:1,d:1,g:3}[e.ch]||0)){d.rv++;d.hp=d.max*.5;e.float(r.x+95,r.dy,'👑 ฟื้นคืนชีพ!','#ffc766')}else{d.hp=0;d.broken=true;this.state='enter'}}}}else{const inside=r.L?this.x<r.x+r.w-8:this.x>r.x+8;if(!inside)this.x+=(r.L?-1:1)*s;else{const dx=e.player.x-this.x,dy=e.player.y-this.y,l=Math.hypot(dx,dy);if(l<18)e.end('GAME_OVER');else{this.x+=dx/l*s;this.y+=dy/l*s}}}}}

const NET={p:null,cs:[],isH:false,code:'',pl:{},ok(){if(typeof Peer==='undefined'){G.toast('โหลด PeerJS ไม่สำเร็จ — ต้องออนไลน์');return false}return true},leave(){try{this.p&&this.p.destroy()}catch(e){}this.p=null;this.cs=[];this.pl={};this.isH=false},bc(m){this.cs.forEach(c=>c.open&&c.send(m))},create(){if(!this.ok())return;this.leave();this.isH=true;this.code=Math.random().toString(36).slice(2,7).toUpperCase();const p=this.p=new Peer('hd1-'+this.code);p.on('open',()=>{this.pl={[p.id]:{n:G.name,ch:G.ch}};G.state='LOBBY';G.renderLobby()});p.on('error',e=>{if(e.type==='unavailable-id')this.create();else G.toast('ข้อผิดพลาด: '+e.type)});p.on('connection',c=>{if(G.state!=='LOBBY'||this.cs.length>=5){c.on('open',()=>c.close());return}this.cs.push(c);c.on('data',d=>this.rx(c,d));c.on('close',()=>{this.cs=this.cs.filter(x=>x!==c);delete this.pl[c.peer];this.bc({t:'lob',pl:this.pl});if(G.state==='LOBBY')G.renderLobby()})})},join(code){code=(code||'').trim().toUpperCase();if(!code||!this.ok())return;this.leave();this.code=code;const p=this.p=new Peer();p.on('error',e=>G.toast(e.type==='peer-unavailable'?'ไม่พบห้องนี้':'เข้าห้องไม่ได้: '+e.type));p.on('open',()=>{const c=p.connect('hd1-'+code,{reliable:true});this.cs=[c];c.on('open',()=>{c.send({t:'hi',n:G.name,ch:G.ch});G.state='LOBBY';G.renderLobby()});c.on('data',d=>this.rx(c,d));c.on('close',()=>{G.toast('หลุดจากห้อง');if(G.state==='LOBBY')G.renderMenu()})})},go(){const ids=Object.keys(this.pl),o=[0,1,2,3,4,5].sort(()=>Math.random()-.5),rm={};ids.forEach((id,i)=>rm[id]=o[i]);this.bc({t:'go',rm});G.startMP(rm)},rx(c,d){if(d.t==='hi'){this.pl[c.peer]={n:d.n,ch:d.ch};this.bc({t:'lob',pl:this.pl});G.renderLobby()}else if(d.t==='lob'){this.pl=d.pl;if(G.state==='LOBBY')G.renderLobby()}else if(d.t==='go')G.startMP(d.rm);else if(d.t==='st'){G.onState(d);if(this.isH)this.cs.forEach(x=>x!==c&&x.open&&x.send(d))}}};
